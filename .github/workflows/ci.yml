name: CI Verification

on:
  push:
    branches: [ main ]
    tags: [ 'phase-*', 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Run automated test suite
        run: npm test
      - name: Verify headless Test Contract & determinism
        run: npm run verify
